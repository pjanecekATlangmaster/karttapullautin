name: Release Linux binary

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/upload (e.g. v2.15.0-oob1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release (Debian bullseye / glibc 2.31)
        # Podkladárna's mambaforge image is older than ubuntu-latest;
        # a host-built binary needs GLIBC_2.34 and fails at runtime.
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            rust:1-bullseye \
            cargo build --release

      - name: Pack tarball
        run: |
          stage=$(mktemp -d)
          install -m 755 target/release/pullauta "$stage/pullauta"
          tar -C "$stage" -czf karttapullautin-x86_64-linux.tar.gz pullauta
          ls -la karttapullautin-x86_64-linux.tar.gz
          # glibc symbols should stay <= 2.31
          (objdump -T target/release/pullauta | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -5) || true

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: karttapullautin-x86_64-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
